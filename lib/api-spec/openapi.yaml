openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Medichain secure medical records API
servers:
  - url: /api
    description: Base API path
security:
  - bearerAuth: []
tags:
  - name: health
  - name: auth
  - name: patient
  - name: doctor
  - name: admin
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationInput"
      responses:
        "201":
          description: Account created or doctor registration submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Invalid registration details
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in, or the password was right and a two-step code is needed (mfaRequired true, no token)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "401":
          description: Invalid credentials or two-step code
  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshInput"
      responses:
        "200":
          description: New tokens for the same session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionTokens"
        "401":
          description: The session has ended; sign in again
  /auth/sign-out:
    post:
      operationId: signOut
      tags: [auth]
      responses:
        "204":
          description: This session has ended on the server
  /auth/password-reset-requests:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequestInput"
      responses:
        "202":
          description: Request received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetRequestAccepted"
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /auth/language:
    put:
      operationId: updateLanguage
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LanguageInput"
      responses:
        "200":
          description: Language saved for the app and notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password changed. Every other session is signed out; this device's session continues (the returned token is its current one).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionToken"
        "400":
          description: Current password is incorrect or new password is invalid
  /auth/sign-out-other-devices:
    post:
      operationId: signOutOtherDevices
      tags: [auth]
      responses:
        "200":
          description: Every other session is signed out; this device's session continues (the returned token is its current one).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionToken"
  /auth/mfa:
    get:
      operationId: getMfaStatus
      tags: [auth]
      responses:
        "200":
          description: Two-step sign-in status for this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaStatus"
  /auth/mfa/setup:
    post:
      operationId: startMfaSetup
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordConfirmation"
      responses:
        "200":
          description: A new secret to add to an authenticator app; confirmed with the first code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaSetup"
  /auth/mfa/enable:
    post:
      operationId: enableMfa
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaCodeInput"
      responses:
        "200":
          description: Two-step sign-in is on. Other sessions are signed out; this device continues with the returned token. The recovery codes are shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaEnabled"
  /auth/mfa/disable:
    post:
      operationId: disableMfa
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordAndCode"
      responses:
        "204":
          description: Two-step sign-in is off (patients only)
  /auth/mfa/recovery-codes:
    post:
      operationId: regenerateMfaRecoveryCodes
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordAndCode"
      responses:
        "200":
          description: New recovery codes; the previous ones stop working
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaRecoveryCodes"
  /patient/profile:
    get:
      operationId: getPatientProfile
      tags: [patient]
      responses:
        "200":
          description: Patient profile and overview counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientProfile"
    put:
      operationId: updatePatientLocation
      tags: [patient]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationProfileInput"
      responses:
        "200":
          description: Updated patient location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /patient/identity:
    put:
      operationId: updatePatientIdentity
      tags: [patient]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientIdentityInput"
      responses:
        "200":
          description: Identity details saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          description: This national ID number is already registered to another account
  /patient/emergency-info:
    put:
      operationId: updateEmergencyInfo
      tags: [patient]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmergencyInfoInput"
      responses:
        "200":
          description: Saved emergency information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmergencyInfo"
  /patient/records:
    get:
      operationId: getPatientRecords
      tags: [patient]
      responses:
        "200":
          description: Patient's own medical records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MedicalRecord"
  /patient/booklet-verification:
    post:
      operationId: createBookletVerification
      tags: [patient]
      responses:
        "200":
          description: Create a public verification reference for the complete booklet export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookletVerificationIssue"
  /booklet-verification/{verificationCode}:
    get:
      operationId: verifyBookletExport
      tags: [patient]
      parameters:
        - name: verificationCode
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Publicly verify that a booklet reference was issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookletVerificationResult"
        "404":
          description: Verification reference not found
  /patient/permissions:
    get:
      operationId: getPatientPermissions
      tags: [patient]
      responses:
        "200":
          description: Patient-controlled doctor permissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccessPermission"
    post:
      operationId: grantPatientPermission
      tags: [patient]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermissionGrantInput"
      responses:
        "201":
          description: Doctor access granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessPermission"
  /patient/permissions/{doctorId}:
    delete:
      operationId: revokePatientPermission
      tags: [patient]
      parameters:
        - name: doctorId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Access revoked
  /patient/pending-requests:
    get:
      operationId: getPatientPendingRequests
      tags: [patient]
      responses:
        "200":
          description: Recent doctor searches for this patient
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PatientSearchRequest"
  /patient/access-settings:
    get:
      operationId: getPatientAccessSettings
      tags: [patient]
      responses:
        "200":
          description: How doctors get access when they enter the patient's CM ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessSettings"
    put:
      operationId: updatePatientAccessSettings
      tags: [patient]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessSettings"
      responses:
        "200":
          description: Access settings saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessSettings"
  /patient/access-requests:
    get:
      operationId: getPatientAccessRequests
      tags: [patient]
      responses:
        "200":
          description: Doctor access requests waiting for the patient's decision
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccessRequest"
  /patient/access-requests/{requestId}/approve:
    post:
      operationId: approvePatientAccessRequest
      tags: [patient]
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessRequestApprovalInput"
      responses:
        "200":
          description: Request approved and access granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessPermission"
        "404":
          description: Request not found or no longer pending
  /patient/access-requests/{requestId}/reject:
    post:
      operationId: rejectPatientAccessRequest
      tags: [patient]
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Request rejected
        "404":
          description: Request not found or no longer pending
  /patient/access-history:
    get:
      operationId: getPatientAccessHistory
      tags: [patient]
      responses:
        "200":
          description: Recent access events for this patient's records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PatientAccessEvent"
  /doctor/profile:
    get:
      operationId: getDoctorProfile
      tags: [doctor]
      responses:
        "200":
          description: Doctor profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    put:
      operationId: updateDoctorProfile
      tags: [doctor]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DoctorProfileInput"
      responses:
        "200":
          description: Updated doctor profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /doctor/emergency-lookup:
    post:
      operationId: emergencyPatientLookup
      tags: [doctor]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmergencyLookupInput"
      responses:
        "200":
          description: Emergency information only, for patients whose full name (and date of birth, if given) match exactly
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PatientSearchResult"
        "422":
          description: Too many patients share this name; add the date of birth
        "429":
          description: Too many emergency lookups
  /doctor/patient-access:
    post:
      operationId: grantPatientAccessById
      tags: [doctor]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientAccessCodeInput"
      responses:
        "200":
          description: Access granted, or a request sent to the patient when they approve each doctor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientBookletAccess"
        "404":
          description: Patient CM ID not found
        "429":
          description: Too many incorrect CM IDs, or the patient recently declined this doctor
  /doctor/patient/{patientId}/attachments/upload-url:
    post:
      operationId: requestPatientAttachmentUpload
      tags: [doctor]
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachmentUploadInput"
      responses:
        "201":
          description: Upload URL and pending attachment metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentUploadResponse"
  /doctor/patient/{patientId}/attachments/pending:
    get:
      operationId: getPendingMedicalAttachments
      tags: [doctor]
      parameters:
        - name: patientId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The doctor's unexpired uploads that are not linked to a record
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PendingMedicalAttachment" }
  /doctor/patient/{patientId}/attachments/{attachmentId}/complete:
    post:
      operationId: confirmMedicalAttachmentUpload
      tags: [doctor]
      parameters:
        - name: patientId
          in: path
          required: true
          schema: { type: integer }
        - name: attachmentId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Upload confirmed and available to attach to a lab record
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: { type: integer }
                  status: { type: string, enum: [READY] }
  /doctor/patient/{patientId}/attachments/{attachmentId}:
    delete:
      operationId: deletePendingMedicalAttachment
      tags: [doctor]
      parameters:
        - name: patientId
          in: path
          required: true
          schema: { type: integer }
        - name: attachmentId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Pending upload and private file deleted
  /attachments/download-url:
    get:
      operationId: getMedicalAttachmentDownloadUrl
      tags: [patient, doctor]
      parameters:
        - name: patientId
          in: query
          required: true
          schema:
            type: integer
        - name: objectPath
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Short-lived URL for an authorized record attachment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentDownloadResponse"
  /disease-codes:
    get:
      operationId: searchDiseaseCodes
      tags: [doctor]
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 2
      responses:
        "200":
          description: Matching active disease codes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiseaseCode"
  /doctor/patient/{patientId}/emergency:
    get:
      operationId: getPatientEmergency
      tags: [doctor]
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Emergency information available to active doctors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmergencyInfo"
  /doctor/patient/{patientId}/records:
    get:
      operationId: getDoctorPatientRecords
      tags: [doctor]
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Patient records when access is active
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MedicalRecord"
    post:
      operationId: addDoctorPatientRecord
      tags: [doctor]
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MedicalRecordInput"
      responses:
        "201":
          description: Medical record added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedicalRecord"
  /doctor/stats:
    get:
      operationId: getDoctorStats
      tags: [doctor]
      responses:
        "200":
          description: Doctor activity summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorStats"
  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      responses:
        "200":
          description: System-wide aggregate statistics without patient records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"
  /admin/analytics:
    get:
      operationId: getAdminAnalytics
      tags: [admin]
      responses:
        "200":
          description: Aggregate system health and activity data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAnalytics"
  /admin/disease-codes/{diseaseCodeId}/epidemic-threshold:
    put:
      operationId: updateAdminEpidemicThreshold
      tags: [admin]
      parameters:
        - name: diseaseCodeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminEpidemicThresholdInput"
      responses:
        "200":
          description: Epidemic case alert threshold updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEpidemicThreshold"
        "404":
          description: Epidemic-relevant disease not found
  /admin/pending-doctors:
    get:
      operationId: getPendingDoctors
      tags: [admin]
      responses:
        "200":
          description: Doctor registrations awaiting approval
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
  /admin/doctors/{doctorId}/approve:
    post:
      operationId: approveDoctor
      tags: [admin]
      parameters:
        - name: doctorId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Doctor approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /admin/doctors/{doctorId}/revoke:
    post:
      operationId: revokeDoctor
      tags: [admin]
      parameters:
        - name: doctorId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Doctor access deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /admin/doctors/{doctorId}/verify:
    post:
      operationId: verifyDoctor
      tags: [admin]
      parameters:
        - name: doctorId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Doctor medical credentials verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Doctor has not submitted a medical number
  /admin/users/{userId}/status:
    put:
      operationId: updateAdminUserStatus
      tags: [admin]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserStatusInput"
      responses:
        "200":
          description: Account status updated without deleting account data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid account status change
  /admin/security-events:
    get:
      operationId: getAdminSecurityEvents
      tags: [admin]
      responses:
        "200":
          description: The 200 most recent security events (kept 12 months)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SecurityEvent"
  /admin/users/{userId}/mfa/reset:
    post:
      operationId: resetAdminUserMfa
      tags: [admin]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Two-step sign-in removed after the administrator verified the account holder; every session of the account is signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /admin/password-reset-requests:
    get:
      operationId: getAdminPasswordResetRequests
      tags: [admin]
      responses:
        "200":
          description: Pending password reset requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminPasswordResetRequest"
  /admin/password-reset-requests/{requestId}/reset:
    post:
      operationId: resetAdminRequestedPassword
      tags: [admin]
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Password reset with a temporary password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPasswordResetResult"
        "404":
          description: Request is no longer pending or account no longer exists
  /account/consent:
    post:
      operationId: acceptLegalTerms
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentInput"
      responses:
        "200":
          description: Consent recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /account/data-export:
    get:
      operationId: exportMyData
      tags: [auth]
      responses:
        "200":
          description: Everything Mon carnet holds about the signed-in account, as JSON
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /account/deletion-request:
    get:
      operationId: getMyDeletionRequest
      tags: [auth]
      responses:
        "200":
          description: The latest deletion request for this account, or null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AccountDeletionRequest"
                  - type: "null"
    post:
      operationId: requestAccountDeletion
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDeletionInput"
      responses:
        "201":
          description: Deletion request recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletionRequest"
    delete:
      operationId: cancelAccountDeletion
      tags: [auth]
      responses:
        "204":
          description: Pending request cancelled
  /admin/deletion-requests:
    get:
      operationId: getAdminDeletionRequests
      tags: [admin]
      responses:
        "200":
          description: Pending account deletion requests, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminDeletionRequest"
  /admin/deletion-requests/{requestId}/resolve:
    post:
      operationId: resolveAdminDeletionRequest
      tags: [admin]
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeletionResolutionInput"
      responses:
        "200":
          description: Request resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletionRequest"
  /admin/possible-duplicates:
    get:
      operationId: getAdminPossibleDuplicates
      tags: [admin]
      responses:
        "200":
          description: Groups of active patient accounts that may belong to the same person
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PossibleDuplicateGroup"
  /admin/search-user:
    get:
      operationId: searchUsers
      tags: [admin]
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 2
      responses:
        "200":
          description: Matching account summaries without medical records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
  /admin/directory:
    get:
      operationId: getAdminDirectory
      tags: [admin]
      parameters:
        - name: kind
          in: query
          required: true
          schema: { type: string, enum: [PATIENTS, DOCTORS, HOSPITALS] }
        - name: region
          in: query
          schema: { type: string }
        - name: arrondissement
          in: query
          schema: { type: string }
        - name: uncertified
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Filtered location directory without medical records or patient contact details
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminDirectoryEntry" }
  /admin/directory/export:
    get:
      operationId: exportAdminDirectory
      tags: [admin]
      parameters:
        - name: kind
          in: query
          required: true
          schema: { type: string, enum: [PATIENTS, DOCTORS, HOSPITALS] }
        - name: region
          in: query
          schema: { type: string }
        - name: arrondissement
          in: query
          schema: { type: string }
        - name: uncertified
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: CSV export of the filtered directory
          content:
            text/csv:
              schema: { type: string }
  /admin/notifications:
    post:
      operationId: sendAdminNotification
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminNotificationInput" }
      responses:
        "201":
          description: Notification delivered to a snapshotted audience
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminNotificationResult" }
  /notifications:
    get:
      operationId: getNotificationInbox
      tags: [auth]
      responses:
        "200":
          description: Current user's in-app notifications
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationInbox" }
  /notifications/{notificationId}/read:
    put:
      operationId: markNotificationRead
      tags: [auth]
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Notification marked as read
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notification" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    Role:
      type: string
      enum: [PATIENT, PENDING_DOCTOR, DOCTOR, ADMIN]
    AccountStatus:
      type: string
      enum: [PENDING, ACTIVE, INACTIVE]
    User:
      type: object
      required: [id, email, name, role, status, isActive, createdAt, hospitalName, professionalMedicalNumber, doctorVerified, locationRegion, locationArrondissement, preferredLanguage, sex, dateOfBirthEstimated, termsVersion, termsAcceptedAt, healthDataConsentAt, mfaEnabled, mfaRequired]
      properties:
        termsVersion: { type: ["string", "null"], description: "Version of the privacy policy and terms this account accepted." }
        termsAcceptedAt: { type: ["string", "null"], format: date-time }
        healthDataConsentAt: { type: ["string", "null"], format: date-time, description: "Patients: when they consented to the processing of their health data." }
        sex: { oneOf: [{ $ref: "#/components/schemas/Sex" }, { type: "null" }] }
        dateOfBirthEstimated: { type: boolean, description: "True when only the birth year is known; dateOfBirth is then 1 January of that year." }
        preferredLanguage: { $ref: "#/components/schemas/Language" }
        mfaEnabled: { type: boolean, description: "Two-step sign-in with an authenticator app is on." }
        mfaRequired: { type: boolean, description: "This role must use two-step sign-in (doctors and administrators)." }
        id: { type: integer }
        email: { type: string, format: email }
        name: { type: string }
        hospitalName: { type: ["string", "null"] }
        locationRegion: { type: ["string", "null"] }
        locationArrondissement: { type: ["string", "null"] }
        professionalMedicalNumber: { type: ["string", "null"] }
        doctorVerified: { type: boolean }
        role: { $ref: "#/components/schemas/Role" }
        status: { $ref: "#/components/schemas/AccountStatus" }
        dateOfBirth: { type: ["string", "null"], format: date }
        contactInfo: { type: ["string", "null"] }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
    SecurityEvent:
      type: object
      required: [id, type, severity, createdAt, ipAddress, details]
      properties:
        id: { type: integer }
        type: { type: string }
        severity: { type: string, enum: [info, warning, critical] }
        createdAt: { type: string, format: date-time }
        ipAddress: { type: ["string", "null"] }
        details:
          type: object
          additionalProperties: true
    SessionToken:
      type: object
      required: [token]
      properties:
        token: { type: string }
    AuthSession:
      type: object
      required: [token, refreshToken, expiresAt, user]
      properties:
        token: { type: string, description: "Access token (about one hour). Renew it with /auth/refresh before expiresAt." }
        refreshToken: { type: string }
        expiresAt: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/User" }
    SessionTokens:
      type: object
      required: [token, refreshToken, expiresAt]
      properties:
        token: { type: string }
        refreshToken: { type: string }
        expiresAt: { type: string, format: date-time }
    RefreshInput:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 1, maxLength: 512 }
    RegistrationInput:
      type: object
      required: [name, email, password, role]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 128 }
        preferredLanguage: { $ref: "#/components/schemas/Language" }
        acceptedTermsVersion: { type: string, maxLength: 40, description: "Must equal the current privacy policy and terms version." }
        healthDataConsent: { type: boolean, description: "Required (true) for patients." }
        sex: { $ref: "#/components/schemas/Sex" }
        dateOfBirthEstimated: { type: boolean }
        nationalIdNumber: { type: string, maxLength: 30 }
        role: { type: string, enum: [PATIENT, DOCTOR] }
        dateOfBirth: { type: string, format: date }
        contactInfo: { type: string, maxLength: 300 }
        professionalMedicalNumber: { type: string, maxLength: 120 }
    DoctorProfileInput:
      type: object
      required: [hospitalName, professionalMedicalNumber]
      properties:
        hospitalName: { type: string, maxLength: 180 }
        professionalMedicalNumber: { type: string, maxLength: 120 }
        locationRegion: { type: ["string", "null"] }
        locationArrondissement: { type: ["string", "null"] }
    LocationProfileInput:
      type: object
      required: [locationRegion, locationArrondissement]
      properties:
        locationRegion: { type: ["string", "null"] }
        locationArrondissement: { type: ["string", "null"] }
    AdminDirectoryEntry:
      type: object
      required: [userId, name, kind, region, arrondissement, hospitalName, doctorVerified]
      properties:
        userId: { type: ["integer", "null"] }
        name: { type: string }
        kind: { type: string, enum: [PATIENTS, DOCTORS, HOSPITALS] }
        region: { type: ["string", "null"] }
        arrondissement: { type: ["string", "null"] }
        hospitalName: { type: ["string", "null"] }
        doctorVerified: { type: boolean }
    AdminNotificationInput:
      type: object
      required: [title, body, targetType]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        body: { type: string, minLength: 1, maxLength: 2000 }
        targetType: { type: string, enum: [ALL, REGION, ARRONDISSEMENT, USERS] }
        region: { type: ["string", "null"] }
        arrondissement: { type: ["string", "null"] }
        userIds:
          type: array
          maxItems: 500
          items: { type: integer, minimum: 1 }
    AdminNotificationResult:
      type: object
      required: [recipientCount]
      properties:
        recipientCount: { type: integer }
    Notification:
      type: object
      required: [id, title, body, createdAt, readAt]
      properties:
        id: { type: integer }
        title: { type: string }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        readAt: { type: ["string", "null"], format: date-time }
    NotificationInbox:
      type: object
      required: [items, unreadCount]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
        unreadCount: { type: integer }
    AdminUserStatusInput:
      type: object
      required: [isActive]
      properties:
        isActive: { type: boolean }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, maxLength: 128 }
        code: { type: string, maxLength: 20, description: "Six-digit code from the authenticator app, or a recovery code, when two-step sign-in is on." }
    LoginResult:
      type: object
      required: [mfaRequired]
      properties:
        mfaRequired: { type: boolean }
        token: { type: string }
        refreshToken: { type: string }
        expiresAt: { type: string, format: date-time }
        authenticatorRemoved: { type: boolean, description: "True after signing in with a recovery code: the lost authenticator was removed and must be set up again." }
        user: { $ref: "#/components/schemas/User" }
    PasswordConfirmation:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 1, maxLength: 128 }
    MfaCodeInput:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 1, maxLength: 20 }
    PasswordAndCode:
      type: object
      required: [password, code]
      properties:
        password: { type: string, minLength: 1, maxLength: 128 }
        code: { type: string, minLength: 1, maxLength: 20 }
    MfaStatus:
      type: object
      required: [enabled, required, recoveryCodesRemaining]
      properties:
        enabled: { type: boolean }
        required: { type: boolean }
        recoveryCodesRemaining: { type: integer }
    MfaSetup:
      type: object
      required: [secret, otpauthUrl]
      properties:
        secret: { type: string }
        otpauthUrl: { type: string }
    MfaRecoveryCodes:
      type: object
      required: [recoveryCodes]
      properties:
        recoveryCodes: { type: array, items: { type: string } }
    MfaEnabled:
      type: object
      required: [recoveryCodes, token, refreshToken, expiresAt]
      properties:
        recoveryCodes: { type: array, items: { type: string } }
        token: { type: string }
        refreshToken: { type: string }
        expiresAt: { type: string, format: date-time }
    PasswordResetRequestInput:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    PasswordResetRequestAccepted:
      type: object
      required: [message]
      properties:
        message: { type: string }
    AdminPasswordResetRequest:
      type: object
      required: [id, email, requestedAt]
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        requestedAt: { type: string, format: date-time }
    AdminPasswordResetResult:
      type: object
      required: [email, temporaryPassword]
      properties:
        email: { type: string, format: email }
        temporaryPassword: { type: string }
    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 128 }
        newPassword: { type: string, minLength: 8, maxLength: 128 }
    EmergencyInfo:
      type: object
      required: [patientId, patientName, patientSex, patientDateOfBirth, patientDateOfBirthEstimated, bloodGroup, weightKg, heightCm, allergies, emergencyContact, updatedAt]
      properties:
        patientId: { type: integer }
        patientName: { type: string }
        patientSex: { oneOf: [{ $ref: "#/components/schemas/Sex" }, { type: "null" }] }
        patientDateOfBirth: { type: ["string", "null"], format: date }
        patientDateOfBirthEstimated: { type: boolean }
        bloodGroup: { type: string }
        weightKg: { type: number }
        heightCm: { type: number }
        allergies: { type: string }
        emergencyContact: { type: string }
        updatedAt: { type: string, format: date-time }
    EmergencyInfoInput:
      type: object
      required: [bloodGroup, weightKg, heightCm, allergies, emergencyContact]
      properties:
        bloodGroup: { type: string, enum: [A+, A-, B+, B-, AB+, AB-, O+, O-, Unknown] }
        weightKg: { type: number, minimum: 1, maximum: 500 }
        heightCm: { type: number, minimum: 30, maximum: 260 }
        allergies: { type: string, maxLength: 2000 }
        emergencyContact: { type: string, maxLength: 300 }
    PatientProfile:
      type: object
      required: [user, patientDisplayId, patientAccessId, emergencyInfo, recordCount, permissionsCount, nationalIdNumber]
      properties:
        nationalIdNumber: { type: ["string", "null"] }
        user: { $ref: "#/components/schemas/User" }
        patientDisplayId: { type: string, minLength: 8, maxLength: 8, pattern: "^CM[A-Z0-9]{6}$" }
        patientAccessId:
          type: string
          minLength: 8
          maxLength: 8
          pattern: "^CM[A-Z0-9]{6}$"
          description: Compatibility field containing the same CM ID used to identify the profile and grant booklet access.
        emergencyInfo: { oneOf: [{ $ref: "#/components/schemas/EmergencyInfo" }, { type: "null" }] }
        recordCount: { type: integer }
        permissionsCount: { type: integer }
    MedicalRecord:
      type: object
      required: [id, patientId, doctorId, doctorName, recordType, diagnosis, treatment, medications, notes, vitals, followUpToRecordId, codedDiagnoses, createdAt]
      properties:
        id: { type: integer }
        patientId: { type: integer }
        doctorId: { type: integer }
        doctorName: { type: string }
        recordType:
          type: string
          enum: [Consultation, Diagnosis, Treatment, Lab Results, Prescription, Surgery, Emergency, Follow-up, Other]
        diagnosis: { type: string }
        treatment: { type: string }
        medications:
          type: array
          items: { type: string }
        notes: { type: string }
        followUpToRecordId: { type: ["integer", "null"] }
        codedDiagnoses:
          type: array
          items: { $ref: "#/components/schemas/CodedDiagnosis" }
        vitals:
          type: object
          properties:
            bloodPressure: { type: ["string", "null"] }
            heartRate: { type: ["number", "null"] }
            temperature: { type: ["number", "null"] }
            weightKg: { type: ["number", "null"] }
        createdAt: { type: string, format: date-time }
    MedicalRecordInput:
      type: object
      required: [recordType, diagnosis, treatment, medications, notes, vitals, followUpToRecordId]
      properties:
        recordType:
          type: string
          enum: [Consultation, Diagnosis, Treatment, Lab Results, Prescription, Surgery, Emergency, Follow-up, Other]
        diagnosis: { type: string, maxLength: 5000 }
        treatment: { type: string, maxLength: 5000 }
        medications:
          type: array
          items: { type: string, maxLength: 200 }
        notes: { type: string, maxLength: 10000 }
        followUpToRecordId: { type: ["integer", "null"] }
        attachmentIds:
          type: array
          maxItems: 5
          items: { type: integer, minimum: 1 }
        codedDiagnoses:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/CodedDiagnosisInput" }
        vitals:
          type: object
          properties:
            bloodPressure: { type: ["string", "null"], maxLength: 30 }
            heartRate: { type: ["number", "null"], minimum: 30, maximum: 200 }
            temperature: { type: ["number", "null"], minimum: 30, maximum: 45 }
            weightKg: { type: ["number", "null"], minimum: 1, maximum: 500 }
    DiseaseCode:
      type: object
      required: [id, code, codingSystem, release, diseaseName, description, infectious, epidemicRelevant, pandemicRelevant, status, source]
      properties:
        id: { type: integer }
        code: { type: string }
        codingSystem: { type: string }
        release: { type: string }
        diseaseName: { type: string }
        description: { type: string }
        infectious: { type: boolean }
        epidemicRelevant: { type: boolean }
        pandemicRelevant: { type: boolean }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        source: { type: string }
    AdminEpidemicMetric:
      type: object
      required: [diseaseCodeId, diseaseName, code, codingSystem, last7Cases, previous7Cases, threshold, alertLevel]
      properties:
        diseaseCodeId: { type: integer }
        diseaseName: { type: string }
        code: { type: string }
        codingSystem: { type: string }
        last7Cases: { type: integer }
        previous7Cases: { type: integer }
        threshold: { type: integer }
        alertLevel: { type: string, enum: [NORMAL, WATCH, ALERT] }
    AdminEpidemicThresholdInput:
      type: object
      required: [threshold]
      properties:
        threshold: { type: integer, minimum: 1, maximum: 10000 }
    AdminEpidemicThreshold:
      type: object
      required: [diseaseCodeId, threshold]
      properties:
        diseaseCodeId: { type: integer }
        threshold: { type: integer }
    BookletVerificationIssue:
      type: object
      required: [verificationCode, patientDisplayId, recordCount, issuedAt]
      properties:
        verificationCode: { type: string, format: uuid }
        patientDisplayId: { type: string }
        recordCount: { type: integer }
        issuedAt: { type: string, format: date-time }
    BookletVerificationResult:
      type: object
      required: [valid, recordCount, issuedAt]
      properties:
        valid: { type: boolean, enum: [true] }
        recordCount: { type: integer }
        issuedAt: { type: string, format: date-time }
    MedicalDiagnosisStatus:
      type: string
      enum: [suspected, probable, confirmed, ruled_out]
    CodedDiagnosis:
      type: object
      required: [id, diseaseCode, status, diagnosisDate, onsetDate, notes, supportingRecordId, createdAt]
      properties:
        id: { type: integer }
        diseaseCode: { $ref: "#/components/schemas/DiseaseCode" }
        status: { $ref: "#/components/schemas/MedicalDiagnosisStatus" }
        diagnosisDate: { type: string, format: date }
        onsetDate: { type: ["string", "null"], format: date }
        notes: { type: string }
        supportingRecordId: { type: ["integer", "null"] }
        createdAt: { type: string, format: date-time }
    CodedDiagnosisInput:
      type: object
      required: [diseaseCodeId, status, diagnosisDate, onsetDate, notes, supportingRecordId]
      properties:
        diseaseCodeId: { type: integer }
        status: { $ref: "#/components/schemas/MedicalDiagnosisStatus" }
        diagnosisDate: { type: string, format: date }
        onsetDate: { type: ["string", "null"], format: date }
        notes: { type: string, maxLength: 10000 }
        supportingRecordId: { type: ["integer", "null"] }
    AccessPermission:
      type: object
      required: [id, doctorId, doctorName, doctorEmail, doctorVerified, granted, grantedAt, expiresAt]
      properties:
        id: { type: integer }
        doctorId: { type: integer }
        doctorName: { type: string }
        doctorEmail: { type: string, format: email }
        doctorVerified: { type: boolean }
        granted: { type: boolean }
        grantedAt: { type: string, format: date-time }
        expiresAt: { type: ["string", "null"], format: date-time }
    PermissionGrantInput:
      type: object
      required: [doctorEmail, durationDays]
      properties:
        doctorEmail: { type: string, format: email }
        durationDays: { type: integer, minimum: 1, maximum: 365 }
    AccountDeletionInput:
      type: object
      required: [password, reason]
      properties:
        password: { type: string, minLength: 1, maxLength: 128, description: "Current password, to confirm it is the account owner." }
        reason: { type: ["string", "null"], maxLength: 500 }
    AccountDeletionRequest:
      type: object
      required: [id, status, outcome, reason, resolutionNote, requestedAt, resolvedAt]
      properties:
        id: { type: integer }
        status: { type: string, enum: [PENDING, CANCELLED, REJECTED, COMPLETED] }
        outcome: { type: ["string", "null"], enum: [ERASED, CLOSED, null] }
        reason: { type: ["string", "null"] }
        resolutionNote: { type: ["string", "null"] }
        requestedAt: { type: string, format: date-time }
        resolvedAt: { type: ["string", "null"], format: date-time }
    AdminDeletionRequest:
      type: object
      required: [id, userId, name, email, role, reason, requestedAt, recordCount, attachmentCount]
      properties:
        id: { type: integer }
        userId: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        reason: { type: ["string", "null"] }
        requestedAt: { type: string, format: date-time }
        recordCount: { type: integer, description: "Medical records in the patient's file, or written by the doctor." }
        attachmentCount: { type: integer }
    DeletionResolutionInput:
      type: object
      required: [action, note]
      properties:
        action:
          type: string
          enum: [ERASE, CLOSE, REJECT]
          description: "ERASE deletes the patient's account, records and files. CLOSE removes sign-in and contact details and revokes access but keeps medical records. REJECT keeps the account (a note is required)."
        note: { type: ["string", "null"], maxLength: 500 }
    ConsentInput:
      type: object
      required: [termsVersion, healthDataConsent]
      properties:
        termsVersion: { type: string, maxLength: 40 }
        healthDataConsent: { type: boolean }
    Sex:
      type: string
      enum: [FEMALE, MALE]
    PatientIdentityInput:
      type: object
      required: [sex, dateOfBirth, dateOfBirthEstimated, nationalIdNumber]
      properties:
        sex: { $ref: "#/components/schemas/Sex" }
        dateOfBirth: { type: string, format: date }
        dateOfBirthEstimated: { type: boolean }
        nationalIdNumber: { type: ["string", "null"], maxLength: 30, description: "Cameroon national ID card (CNI) number. Optional." }
    PossibleDuplicatePatient:
      type: object
      required: [userId, name, patientDisplayId, sex, dateOfBirth, dateOfBirthEstimated, region, createdAt]
      properties:
        userId: { type: integer }
        name: { type: string }
        patientDisplayId: { type: ["string", "null"] }
        sex: { oneOf: [{ $ref: "#/components/schemas/Sex" }, { type: "null" }] }
        dateOfBirth: { type: ["string", "null"], format: date }
        dateOfBirthEstimated: { type: boolean }
        region: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    PossibleDuplicateGroup:
      type: object
      required: [reason, patients]
      properties:
        reason: { type: string, enum: [SAME_NAME_AND_BIRTH_YEAR], description: "Same name in any word order and the same birth year. National ID numbers are unique, so they never repeat." }
        patients:
          type: array
          items: { $ref: "#/components/schemas/PossibleDuplicatePatient" }
    Language:
      type: string
      enum: [fr, en]
    LanguageInput:
      type: object
      required: [language]
      properties:
        language: { $ref: "#/components/schemas/Language" }
    AccessApprovalMode:
      type: string
      enum: [AUTOMATIC, ASK]
      description: AUTOMATIC grants access until revoked when a doctor enters the CM ID; ASK waits for the patient's approval.
    AccessSettings:
      type: object
      required: [accessApprovalMode]
      properties:
        accessApprovalMode: { $ref: "#/components/schemas/AccessApprovalMode" }
    AccessRequest:
      type: object
      required: [id, doctorId, doctorName, doctorEmail, doctorVerified, hospitalName, requestedAt, expiresAt]
      properties:
        id: { type: integer }
        doctorId: { type: integer }
        doctorName: { type: string }
        doctorEmail: { type: string, format: email }
        doctorVerified: { type: boolean }
        hospitalName: { type: ["string", "null"] }
        requestedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    AccessRequestApprovalInput:
      type: object
      required: [durationDays]
      properties:
        durationDays:
          type: ["integer", "null"]
          minimum: 1
          maximum: 365
          description: Number of days the access lasts, or null to keep access until the patient revokes it.
    PatientAccessCodeInput:
      type: object
      description: The patient's CM ID, which also grants booklet access when entered by a doctor.
      required: [patientDisplayId]
      properties:
        patientDisplayId:
          type: string
          minLength: 8
          maxLength: 8
          pattern: "^CM[A-Z0-9]{6}$"
          description: The patient's CM ID and booklet access code.
    PatientBookletAccess:
      type: object
      required: [status, patientId, patientDisplayId, patientName, patientSex, patientDateOfBirth, patientDateOfBirthEstimated, patientNationalIdNumber]
      properties:
        patientSex: { oneOf: [{ $ref: "#/components/schemas/Sex" }, { type: "null" }] }
        patientDateOfBirth: { type: ["string", "null"], format: date }
        patientDateOfBirthEstimated: { type: boolean }
        patientNationalIdNumber: { type: ["string", "null"], description: "Only when access is granted; null while a request is pending." }
        status:
          type: string
          enum: [GRANTED, PENDING]
          description: PENDING means the patient must approve the request before the booklet opens.
        patientId: { type: integer }
        patientDisplayId: { type: string, minLength: 8, maxLength: 8, pattern: "^CM[A-Z0-9]{6}$" }
        patientName: { type: string }
    PatientSearchRequest:
      type: object
      required: [doctorId, doctorName, doctorEmail, doctorVerified, searchedAt, reason, hospitalName]
      properties:
        reason: { type: ["string", "null"] }
        hospitalName: { type: ["string", "null"] }
        doctorId: { type: integer }
        doctorName: { type: string }
        doctorEmail: { type: string, format: email }
        doctorVerified: { type: boolean }
        searchedAt: { type: string, format: date-time }
    EmergencyLookupInput:
      type: object
      required: [fullName, dateOfBirth, reason]
      properties:
        fullName: { type: string, minLength: 3, maxLength: 120, description: "The patient's full name, in any word order." }
        dateOfBirth: { type: ["string", "null"], format: date }
        reason: { type: string, minLength: 10, maxLength: 300, description: Why emergency information is needed without the patient's CM ID. Shown to the patient. }
    PatientSearchResult:
      type: object
      required: [emergencyInfo]
      properties:
        emergencyInfo: { $ref: "#/components/schemas/EmergencyInfo" }
    MedicalAttachment:
      type: object
      required: [fileName, contentType, size]
      properties:
        fileName: { type: string }
        contentType: { type: string }
        size: { type: integer }
    AttachmentUploadInput:
      type: object
      required: [fileName, contentType, size]
      properties:
        fileName: { type: string, minLength: 1, maxLength: 255 }
        contentType: { type: string, enum: [application/pdf, image/png, image/jpeg] }
        size: { type: integer, minimum: 1, maximum: 10485760 }
    AttachmentUploadResponse:
      type: object
      required: [attachmentId, uploadURL, fileName, contentType, size]
      properties:
        attachmentId: { type: integer }
        uploadURL: { type: string, format: uri }
        fileName: { type: string }
        contentType: { type: string }
        size: { type: integer }
    PendingMedicalAttachment:
      type: object
      required: [id, fileName, contentType, size, status, expiresAt]
      properties:
        id: { type: integer }
        fileName: { type: string }
        contentType: { type: string }
        size: { type: integer }
        status: { type: string, enum: [UPLOADING, READY] }
        expiresAt: { type: ["string", "null"], format: date-time }
    AttachmentDownloadResponse:
      type: object
      required: [downloadURL]
      properties:
        downloadURL: { type: string, format: uri }
    PatientAccessEvent:
      type: object
      required: [id, doctorName, hospitalName, action, accessedAt]
      properties:
        id: { type: integer }
        doctorName: { type: string }
        hospitalName: { type: string }
        action: { type: string }
        accessedAt: { type: string, format: date-time }
    DoctorStats:
      type: object
      required: [patientsTreated, recordsAdded, recordsThisMonth]
      properties:
        patientsTreated: { type: integer }
        recordsAdded: { type: integer }
        recordsThisMonth: { type: integer }
    AdminStats:
      type: object
      required: [totalPatients, activeDoctors, pendingDoctors, totalConsultations, activePermissions]
      properties:
        totalPatients: { type: integer }
        activeDoctors: { type: integer }
        pendingDoctors: { type: integer }
        totalConsultations: { type: integer }
        activePermissions: { type: integer }
    AdminAnalytics:
      type: object
      required: [stats, monthlyRecords, systemStatus, epidemicMetrics, recordsByType, regionalActivity, clinicActivity]
      properties:
        stats: { $ref: "#/components/schemas/AdminStats" }
        monthlyRecords:
          type: array
          items:
            type: object
            required: [month, count]
            properties:
              month: { type: string }
              count: { type: integer }
        recordsByType:
          type: array
          items:
            type: object
            required: [recordType, count]
            properties:
              recordType: { type: string }
              count: { type: integer }
        regionalActivity:
          type: array
          items:
            type: object
            required: [region, patientCount, recordCount]
            properties:
              region: { type: string }
              patientCount: { type: integer }
              recordCount: { type: integer }
        clinicActivity:
          type: array
          items:
            type: object
            required: [hospitalName, region, patientCount, recordCount]
            properties:
              hospitalName: { type: string }
              region: { type: ["string", "null"] }
              patientCount: { type: integer }
              recordCount: { type: integer }
        systemStatus:
          type: array
          items:
            type: object
            required: [name, status]
            properties:
              name: { type: string }
              status: { type: string, enum: [Operational, Attention] }
        epidemicMetrics:
          type: array
          items:
            $ref: "#/components/schemas/AdminEpidemicMetric"