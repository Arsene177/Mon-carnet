# Render Blueprint: the Mon carnet web service on Render's free plan. Setup: docs/render.md.
# Values marked `sync: false` are secrets: Render asks for them and never stores them in this file.
#
# The free plan has no pre-deploy step, Shell or cron jobs, so the server does those jobs itself:
#   SCHEMA_PUSH_ON_START  updates the Supabase schema before each start (scripts/start.sh)
#   INITIAL_ADMIN_*       creates the first administrator once (remove after the first sign-in)
#   BACKUP_SCHEDULE       makes the daily encrypted backup (checked every hour while awake)
# A free service sleeps after 15 minutes without requests: an uptime monitor calling /api/readyz
# every 5 minutes keeps it awake (docs/render.md, Part 5).
services:
  - type: web
    name: mon-carnet-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Close to the Supabase project in Paris (eu-west-3). Cannot be changed after creation.
    region: frankfurt
    plan: free
    healthCheckPath: /api/healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      # At least 32 characters. Keep a copy in a password manager and on paper: without it no
      # backup can ever be read. Never change it.
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      # Optional: Slack, Discord, Teams or webhook-to-email URL for security alerts.
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: SCHEMA_PUSH_ON_START
        value: "true"
      - key: BACKUP_SCHEDULE
        value: daily
      # Proxies in front of the app; check with GET /api/client-address after deploying.
      - key: TRUST_PROXY
        value: "1"
