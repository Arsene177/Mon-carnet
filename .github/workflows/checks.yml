name: Checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm run typecheck
      - name: Every interface text has a French translation
        run: pnpm --filter @workspace/medichain run i18n:check
      # The tests run against a local Supabase stack (database, Auth, Storage, REST API) configured by
      # supabase/config.toml, like the project the app runs on.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.62.10
      - name: Start local Supabase
        run: supabase start -x studio,realtime,edge-runtime,logflare,vector,imgproxy,supavisor,postgres-meta,mailpit
      - name: Test settings from the local Supabase stack
        run: scripts/supabase-test-env.sh | sed -e 's/^export //' -e "s/'//g" >> "$GITHUB_ENV"
      # The backup tests need pg_dump and pg_restore of the same major version as the database.
      # Run them from the postgres:17 image, whatever the runner ships.
      - name: PostgreSQL 17 client tools for the backup tests
        run: |
          mkdir -p "$HOME/pg17/bin"
          for tool in pg_dump pg_restore; do
            cat > "$HOME/pg17/bin/$tool" <<SCRIPT
          #!/bin/sh
          exec docker run --rm -i --network host --user "$(id -u):$(id -g)" \\
            -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE -e PGSSLMODE \\
            -v /tmp:/tmp postgres:17 $tool "\$@"
          SCRIPT
            chmod +x "$HOME/pg17/bin/$tool"
          done
          echo "$HOME/pg17/bin" >> "$GITHUB_PATH"
          "$HOME/pg17/bin/pg_dump" --version
      - name: Create the schema and close it to the public API
        run: pnpm --filter @workspace/db run push
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Access-rule, Supabase, monitoring and backup tests
        run: pnpm --filter @workspace/api-server run test
      - name: Build the web app for the accessibility check
        run: pnpm --filter @workspace/medichain run build
        env:
          PORT: "4173"
          BASE_PATH: /
      - name: Browser for the accessibility check
        run: pnpm --filter @workspace/api-server exec playwright install --with-deps chromium
      - name: Accessibility check (WCAG 2.2 AA rules and reflow, every screen)
        run: pnpm --filter @workspace/api-server run test:accessibility
      # The image Render builds and runs (Dockerfile, render.yaml): it must build, start against
      # Supabase, serve the web app and the API, and contain the PostgreSQL 17 tools for backups.
      - name: Build the Render image
        run: docker build -t mon-carnet .
      - name: Start the image and check it answers
        run: |
          docker run -d --name mon-carnet --network host \
            -e PORT=10000 -e DATABASE_URL="$TEST_DATABASE_URL" -e SUPABASE_URL -e SUPABASE_SECRET_KEY -e SUPABASE_JWT_SECRET \
            -e SUPABASE_STORAGE_BUCKET=medical-attachments-image-check mon-carnet
          for attempt in $(seq 1 60); do curl -fs http://127.0.0.1:10000/api/healthz && break; sleep 1; done
          curl -fs http://127.0.0.1:10000/api/readyz
          curl -fs http://127.0.0.1:10000/ | grep -q '<div id="root">'
          curl -fs http://127.0.0.1:10000/patient | grep -q '<div id="root">'
          curl -fsI http://127.0.0.1:10000/ | grep -i '^content-security-policy:'
          docker exec mon-carnet pg_dump --version | grep -q ' 17\.'
      - name: Image logs
        if: always()
        run: docker logs mon-carnet 2>&1 | tail -50 || true
