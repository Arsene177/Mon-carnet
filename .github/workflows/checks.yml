name: Checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: moncarnet_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/moncarnet_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: PostgreSQL 16 client tools for the backup tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: Type check
        run: pnpm run typecheck
      - name: Every interface text has a French translation
        run: pnpm --filter @workspace/medichain run i18n:check
      - name: Create the test database schema
        run: pnpm --filter @workspace/db run push
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Access-rule and backup tests
        run: pnpm --filter @workspace/api-server run test
