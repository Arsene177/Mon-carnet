name: Checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: moncarnet_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/moncarnet_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The backup tests need pg_dump and pg_restore of the same major version as the database.
      # Run them from the postgres:16 image the service already uses, whatever the runner ships.
      - name: PostgreSQL 16 client tools for the backup tests
        run: |
          mkdir -p "$HOME/pg16/bin"
          for tool in pg_dump pg_restore; do
            cat > "$HOME/pg16/bin/$tool" <<SCRIPT
          #!/bin/sh
          exec docker run --rm -i --network host --user "$(id -u):$(id -g)" \\
            -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE -e PGSSLMODE \\
            -v /tmp:/tmp postgres:16 $tool "\$@"
          SCRIPT
            chmod +x "$HOME/pg16/bin/$tool"
          done
          echo "$HOME/pg16/bin" >> "$GITHUB_PATH"
          "$HOME/pg16/bin/pg_dump" --version
      - name: Type check
        run: pnpm run typecheck
      - name: Every interface text has a French translation
        run: pnpm --filter @workspace/medichain run i18n:check
      - name: Create the test database schema
        run: pnpm --filter @workspace/db run push
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Access-rule and backup tests
        run: pnpm --filter @workspace/api-server run test
